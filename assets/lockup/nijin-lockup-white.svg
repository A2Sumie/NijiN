<svg xmlns="http://www.w3.org/2000/svg" width="856" height="360" viewBox="0 0 856 360" role="img" aria-labelledby="title desc">
  <title id="title">NijiN · 活力拼块配套组合</title>
  <desc id="desc">原割圆术图标不变，搭配较低字高、轻微前倾、斜接色块与几何折笔末尾N的十五色字标。整体内容居中缩至85%，增加外侧留白；原画布尺寸、内部比例和配色保持。</desc>
  <rect id="background" width="856" height="360" fill="#FFFFFF" />
  <g id="padding-content-v4" transform="translate(64.2 27) scale(0.85)">
    <svg width="256" height="256" viewBox="0 0 512 512" role="img" x="24" y="48">
      <title id="icon-title">割圆术 · 4-5-6 · 按长度左侧 · 红灰藏青浅粉</title>
      <desc id="icon-desc">保持原4-5-6与圆弧的几何、间距、四层32线宽及32宽换色窄带。按长度取左侧半边外框61.8%黄金点并连向圆心。仅在该窄带内，四层从外到内使用红色#E64646、深灰色#747A82、藏青色#243A5E、冷浅粉色#F0B6DE。条带外保持原竹绿、粉玫红、天蓝、亮黄。透明背景。</desc>
      <defs>
        <clipPath id="icon-quarter-sector" clipPathUnits="userSpaceOnUse">
          <rect width="472" height="472" />
        </clipPath>
        <clipPath id="icon-accent-band" clipPathUnits="userSpaceOnUse">
          <polygon points="477.709153,457.053242 -316.337352,153.754466 -327.755659,183.647981 466.290847,486.946758" />
        </clipPath>
      </defs>
      <g fill="none" stroke-width="32" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4" clip-path="url(#icon-quarter-sector)">
        <path id="icon-polygon-4-layer-1" stroke="#68BE8D" d="M 56 472 L 56 56 L 472 56" />
        <path id="icon-polygon-5-layer-2" stroke="#DE6FA1" d="M 132 472 L 178.48777 178.48777 L 472 132" />
        <path id="icon-polygon-6-layer-3" stroke="#03A9F4" d="M 214 472 L 268.521815 268.521815 L 472 214" />
        <path id="icon-quarter-circle" stroke="#FFF700" d="M 296 472 A 176 176 0 0 1 472 296" />
        <g id="icon-local-accent-palette" clip-path="url(#icon-accent-band)">
          <path id="icon-accent-polygon-4-layer-1" stroke="#E64646" d="M 56 472 L 56 56 L 472 56" />
          <path id="icon-accent-polygon-5-layer-2" stroke="#747A82" d="M 132 472 L 178.48777 178.48777 L 472 132" />
          <path id="icon-accent-polygon-6-layer-3" stroke="#243A5E" d="M 214 472 L 268.521815 268.521815 L 472 214" />
          <path id="icon-accent-quarter-circle" stroke="#F0B6DE" d="M 296 472 A 176 176 0 0 1 472 296" />
        </g>
      </g>
    </svg>
    <svg width="480" height="166.4" viewBox="48 48 600 208" role="img" x="330" y="109">
      <title id="name-title">NijiN · 十五色斜接与几何折笔N</title>
      <desc id="name-desc">保持较低的NijiN字高和十五纯色。前四字轻微前倾，拼块接口斜接；末尾N只取参考中的左腿较直、低折点、右腿外张结构，用三段直线几何块重建，不模仿手写曲线。新增蓝为#0077C8。无渐变，无字体依赖。</desc>
      <defs>
        <clipPath id="name-shape-N-left" clipPathUnits="userSpaceOnUse">
          <path d="M0 164V0H24L130 126V0H154V164H130L24 38V164Z" />
        </clipPath>
        <clipPath id="name-shape-i-left" clipPathUnits="userSpaceOnUse">
          <path d="M194 4H218V28H194ZM194 54H218V164H194Z" />
        </clipPath>
        <clipPath id="name-shape-j-center" clipPathUnits="userSpaceOnUse">
          <path d="M278 4H302V28H278ZM278 54H302V168A40 40 0 0 1 262 208H250V184H262A16 16 0 0 0 278 168Z" />
        </clipPath>
        <clipPath id="name-shape-i-right" clipPathUnits="userSpaceOnUse">
          <path d="M362 4H386V28H362ZM362 54H386V164H362Z" />
        </clipPath>
        <clipPath id="name-shape-N-right" clipPathUnits="userSpaceOnUse">
          <polygon points="11.982970,158.639092 18.091581,44.102629 88.085272,146.760042 109.164901,144.398294 161.164901,12.398294 138.835099,3.601706 95.144081,114.509676 17.914728,1.239958 -3.982970,7.360908 -11.982970,157.360908" />
        </clipPath>
      </defs>
      <g id="name-wordmark" transform="translate(48 48)">
        <g id="name-N-left" data-letter="N" transform="matrix(1 0 -0.06 1 9.84 0)" clip-path="url(#name-shape-N-left)">
          <rect id="name-N-left-diagonal" fill="#EC6A45" data-palette="vermilion" x="0" y="0" width="154" height="164" />
          <rect id="name-N-left-left-stem" fill="#68BE8D" data-palette="bamboo" x="0" y="0" width="24" height="164" />
          <rect id="name-N-left-right-stem" fill="#0077C8" data-palette="blue" x="130" y="0" width="24" height="164" />
        </g>
        <g id="name-i-left" data-letter="i" transform="matrix(1 0 -0.06 1 9.84 0)" clip-path="url(#name-shape-i-left)">
          <rect id="name-i-left-lower-stem" fill="#747A82" data-palette="gray" x="194" y="4" width="24" height="160" />
          <polygon id="name-i-left-upper-stem" fill="#75CED2" data-palette="aqua" points="194,54 218,54 218,114 194,104" />
          <rect id="name-i-left-dot" fill="#E64646" data-palette="red" x="194" y="4" width="24" height="24" />
        </g>
        <g id="name-j-center" data-letter="j" transform="matrix(1 0 -0.06 1 9.84 0)" clip-path="url(#name-shape-j-center)">
          <rect id="name-j-center-hook" fill="#243A5E" data-palette="navy" x="250" y="4" width="52" height="204" />
          <polygon id="name-j-center-stem" fill="#DE6FA1" data-palette="rose" points="278,54 302,54 302,169 278,161" />
          <rect id="name-j-center-dot" fill="#FFF700" data-palette="yellow" x="278" y="4" width="24" height="24" />
        </g>
        <g id="name-i-right" data-letter="i" transform="matrix(1 0 -0.06 1 9.84 0)" clip-path="url(#name-shape-i-right)">
          <rect id="name-i-right-lower-stem" fill="#F0B6DE" data-palette="pale_pink" x="362" y="4" width="24" height="160" />
          <polygon id="name-i-right-upper-stem" fill="#3F7567" data-palette="ink_green" points="362,54 386,54 386,112 362,102" />
          <rect id="name-i-right-dot" fill="#F39A45" data-palette="orange" x="362" y="4" width="24" height="24" />
        </g>
        <g id="name-N-right" data-letter="N" transform="translate(438 0)" clip-path="url(#name-shape-N-right)">
          <rect id="name-N-right-fold" x="-24" y="-24" width="210" height="210" fill="#F6D32D" data-palette="gold" />
          <polygon id="name-N-right-left-rise" points="11.982970,158.639092 19.982970,8.639092 -3.982970,7.360908 -11.982970,157.360908" fill="#9984B8" data-palette="purple" />
          <polygon id="name-N-right-right-rise" points="109.164901,144.398294 161.164901,12.398294 138.835099,3.601706 86.835099,135.601706" fill="#03A9F4" data-palette="sky" />
        </g>
      </g>
    </svg>
  </g>
</svg>
